<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07090d">

<title>METEOSTORM — Live Weather</title>
<style>
:root{--bg:#07090d;--panel:#10141b;--panel2:#171c25;--line:#232a36;--muted:#8791a0;--text:#e9ecf1;--accent:#7db4ff;--accent2:#4f8fe8;--good:#64e7a0;
--bgglow:#101a2b;--hdr:rgba(10,13,18,.72);--card-end:#0d1117;--line2:#1d2430;--shadow:rgba(0,0,0,.35);--hover:#162236;--t1:#fff;--t2:#9fc4ff;--logo-ring:#232a36;--cond:#b6bfcc;--ph:#5f6877;--compass-line:#2c3a4f;--compass-bg:#14213a;--teamspan:#aab3c0;--errc:#ff9b9b}
:root[data-theme="light"]{--bg:#f3f6fb;--panel:#ffffff;--panel2:#eef2f8;--line:#d9e0ea;--muted:#5d6878;--text:#141a24;--accent:#1d63d1;--accent2:#2f74e0;--good:#118a4f;
--bgglow:#dce8fb;--hdr:rgba(255,255,255,.78);--card-end:#f7f9fc;--line2:#e2e8f1;--shadow:rgba(30,50,90,.12);--hover:#e3edfc;--t1:#0b2a5c;--t2:#2f74e0;--logo-ring:#d9e0ea;--cond:#465163;--ph:#8a94a3;--compass-line:#b9cbe6;--compass-bg:#dbe8fb;--teamspan:#4a5565;--errc:#c53030}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:smooth}
html[data-theme="light"]{color-scheme:light}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,var(--bgglow) 0%,var(--bg) 60%) fixed,var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,Segoe UI,"Noto Sans Myanmar","Noto Sans Thai",sans-serif;min-height:100vh}
button,input{font:inherit}

/* Header: brand left, emblem + search centered, status right */
header{position:sticky;top:0;z-index:50;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:10px 22px;background:var(--hdr);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border-bottom:1px solid var(--line)}
.brandwrap{display:flex;align-items:center;gap:12px;min-width:0}
.brand{font-weight:850;letter-spacing:2px;font-size:18px;color:var(--text)}.brand span{color:var(--accent)}
.sub{color:var(--muted);font-size:11px;letter-spacing:1.4px}
.center{display:flex;align-items:center;gap:14px;justify-content:center}
.brand-logo{width:52px;height:52px;object-fit:contain;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--logo-ring),0 0 24px rgba(125,180,255,.25);flex:none}
.search{display:flex;align-items:center;gap:8px}
input{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 14px;width:clamp(180px,26vw,340px);min-width:0;height:44px;outline:none;transition:border-color .2s,box-shadow .2s}
input::placeholder{color:var(--ph)}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(125,180,255,.15)}
button{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:0 18px;height:44px;border-radius:10px;cursor:pointer;font-weight:650;transition:all .2s}
button:hover{border-color:var(--accent);color:var(--accent);background:var(--hover)}
.search button{background:var(--accent2);border-color:var(--accent2);color:#fff;min-width:96px}
.search button:hover{background:#6aa5f5;border-color:#6aa5f5;color:#07090d}
.topright{display:flex;gap:12px;align-items:center;justify-content:flex-end}
.live{color:var(--good);font-size:11px;letter-spacing:1px;white-space:nowrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px;box-shadow:0 0 10px var(--good);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.btn-link{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border:1px solid #ea580c;background:#ea580c;color:#fff;border-radius:10px;font-weight:800;text-decoration:none;white-space:nowrap;transition:all .2s}
.btn-link:hover{border-color:#fb923c;background:#fb923c;color:#1a0f00;box-shadow:0 0 18px rgba(251,146,60,.45)}

/* Content */
main{padding:22px 16px 8px;max-width:1200px;margin:auto}
.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
.card{background:linear-gradient(180deg,var(--panel),var(--card-end));border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 10px 40px var(--shadow)}
.eyebrow{font-size:10px;letter-spacing:1.6px;color:var(--muted);text-transform:uppercase}
.place{font-size:24px;font-weight:750;margin:6px 0 2px}
.updated{font-size:11px;color:var(--muted)}
.temp{font-size:72px;line-height:1.05;font-weight:750;margin:16px 0 2px;background:linear-gradient(180deg,var(--t1),var(--t2));-webkit-background-clip:text;background-clip:text;color:transparent}
.condition{color:var(--cond);font-size:16px}
.windrow{display:flex;align-items:center;gap:16px;margin-top:20px}
.compass{width:64px;height:64px;border:1px solid var(--compass-line);border-radius:50%;display:grid;place-items:center;color:var(--accent);font-size:28px;background:radial-gradient(circle,var(--compass-bg),transparent 70%);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.windval{font-size:24px;font-weight:750}.windval small{font-size:12px;color:var(--muted);font-weight:400}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:var(--panel2);border:1px solid var(--line2);padding:14px;border-radius:12px}
.metric span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.8px}
.metric strong{font-size:20px;display:block;margin-top:6px}
.forecast-card{grid-column:1/-1}
.hours{display:flex;gap:9px;overflow:auto;padding:12px 0 6px;scrollbar-width:thin;scrollbar-color:#2a3342 transparent}
.hour{min-width:78px;text-align:center;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:12px 6px}
.hour small{color:var(--muted);font-size:10px}.hour b{display:block;margin:8px 0 2px;font-size:16px}.hour em{font-style:normal;color:var(--accent);font-size:10px}
.hour .w{font-size:10px;color:var(--muted);margin-top:5px}
.status{color:var(--muted);font-size:11px;margin-top:10px}.error{color:var(--errc)}
.spacer{height:12vh}
footer{padding:18px 20px 40px;color:var(--muted);font-size:11px;text-align:center}
.team-logos{display:flex;justify-content:center;align-items:center;gap:clamp(12px,3vw,34px);flex-wrap:wrap;padding:10px 12px 18px}
.team-logo{display:flex;flex-direction:column;align-items:center;gap:6px}
.team-logo img{width:clamp(62px,10vw,104px);height:clamp(62px,10vw,104px);object-fit:contain;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--logo-ring)}
.team-logo span{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--teamspan)}
.credits{font-size:11px;color:var(--muted)}

/* Scroll reveal (blurred fade-in) */
.reveal{opacity:0;transform:translateY(28px);filter:blur(10px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1),filter .7s ease}
.reveal.in{opacity:1;transform:none;filter:none}

/* Reports */
.rep-bar{display:flex;justify-content:flex-end;margin-bottom:12px}
.rep-small{height:34px;padding:0 12px;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.rep-small[hidden]{display:none}
.rep-box{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:14px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
.rep-box[hidden]{display:none}
.rep-row{display:flex;gap:8px}
.rep-row input{flex:1;width:auto}
textarea{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 14px;width:100%;font:inherit;resize:vertical;min-height:84px;outline:none;transition:border-color .2s,box-shadow .2s}
textarea::placeholder{color:var(--ph)}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(125,180,255,.15)}
.file-btn{display:inline-flex;align-items:center;justify-content:center;height:44px;border:1px dashed var(--line);border-radius:10px;cursor:pointer;font-weight:650;color:var(--accent);background:var(--panel)}
.file-btn:hover{border-color:var(--accent)}
#repPreview{max-width:100%;max-height:220px;border-radius:10px;object-fit:contain;align-self:flex-start}
#repPreview[hidden]{display:none}
.rep-actions{display:flex;gap:8px}
.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}
.primary:hover{background:#6aa5f5;border-color:#6aa5f5;color:#07090d}
.report{border:1px solid var(--line2);background:var(--panel2);border-radius:12px;overflow:hidden;margin-top:12px}
.report img{display:block;width:100%;max-height:420px;object-fit:cover}
.report .body{padding:12px 14px}
.report p{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.report .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:11px}
.report .del{height:30px;padding:0 10px;font-size:12px}
.report .del.armed{border-color:var(--errc);color:var(--errc)}
/* Radar */
.seg.four{grid-template-columns:repeat(4,1fr);margin-bottom:12px}
.radar-frame{border-radius:12px;overflow:hidden;border:1px solid var(--line2);height:min(60vh,440px);background:var(--panel2)}
.radar-frame iframe{display:block;width:100%;height:100%;border:0}
.map-link{display:inline-block;margin-top:10px;color:var(--accent);font-weight:650;text-decoration:none}
.map-link:hover{text-decoration:underline}
/* Daily, saved places, home screen */
.place-row{display:flex;align-items:center;gap:6px;margin:6px 0 2px}
.place-row .place{margin:0;min-width:0}
.star{width:36px;height:36px;padding:0;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;border-radius:50%;flex:none}
.star svg{fill:none}
.star:hover{background:var(--hover);color:#fbbf24}
.star.on{color:#fbbf24}.star.on svg{fill:currentColor}
.saved{margin-bottom:14px}
.saved .set-label{margin-bottom:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.chip{display:inline-flex;align-items:center;flex:none;border:1px solid var(--line);background:var(--panel2);border-radius:999px;white-space:nowrap}
.chip button{height:34px;border:0;background:transparent;color:inherit;border-radius:999px;padding:0 6px 0 14px;font-weight:600;font-size:13px}
.chip .chip-x{padding:0 12px 0 4px;opacity:.65;font-size:16px}
.chip.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
.chip.on button:hover{color:#fff;background:transparent}
.daily{display:flex;flex-direction:column;margin-top:6px}
.day{display:grid;grid-template-columns:60px 28px 40px 36px 1fr 36px;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:14px}
.day:last-child{border-bottom:0}
.dname{font-weight:650}.dicon{font-size:18px;text-align:center}.dpop{color:var(--accent);font-size:11px}
.dlo{color:var(--muted);text-align:right}.dhi{font-weight:700}
.dbar{position:relative;height:6px;border-radius:3px;background:var(--line2)}
.dbar i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--accent),#f59e0b)}
.icon-btn[hidden]{display:none}
.a2hs-steps p{margin:12px 0 0;font-size:14px;line-height:1.55;color:var(--cond)}
.a2hs-steps b{color:var(--text)}
.a2hs-steps .note{font-size:12px;color:var(--muted)}
@media(max-width:520px){
 .topright{gap:6px}
 .icon-btn{width:40px}
 .btn-link{padding:0 12px;gap:6px;font-size:13px}
 .day{grid-template-columns:54px 26px 36px 32px 1fr 32px;gap:6px}
}
@media(max-width:420px){
 .brand{font-size:17px!important;letter-spacing:1px!important}
 .btn-link{padding:0 9px;gap:5px;font-size:12px}
 .btn-link svg{width:15px;height:15px}
 .topright{gap:5px}
 .icon-btn{width:38px;height:40px}
 header{padding-left:10px;padding-right:10px}
}
@media(max-width:380px){
 .brand{font-size:15px!important;letter-spacing:.5px!important}
 .btn-link svg{display:none}
 .topright{gap:4px}
}
@media(max-width:340px){
 .brand{font-size:13px!important;letter-spacing:0!important}
 .btn-link{padding:0 7px;font-size:11px}
 .icon-btn{width:34px}
 .topright{gap:3px}
}
/* Keep wide rows (hourly cards, search) inside the screen */
.grid>*{min-width:0}
.center,.search{min-width:0}
.search input{min-width:0}
/* Favourites tab */
.tabs{flex-wrap:wrap}
.fav-row{display:flex;align-items:stretch;border:1px solid var(--line2);background:var(--panel2);border-radius:12px;margin-top:10px;overflow:hidden}
.fav-row.on{border-color:var(--accent2)}
.fav-go{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;height:auto;min-height:56px;padding:10px 14px;border:0;background:transparent;border-radius:0;color:var(--text)}
.fav-info{flex:1;min-width:0}
.fav-name{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav-sub{display:block;font-size:11px;color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav-temp{font-weight:750;white-space:nowrap}
.fav-x{width:44px;height:auto;border:0;background:transparent;border-radius:0;font-size:18px;color:var(--muted);padding:0}
/* Soundings */
#sndBtn{width:36px;height:36px;border:1.5px solid var(--accent);border-radius:10px;color:var(--accent);background:transparent}
#sndBtn:hover{background:var(--accent2);border-color:var(--accent2);color:#fff}
.snd-card{width:min(520px,100%);max-height:92vh;overflow:auto}
.snd-sub{color:var(--muted);font-size:11px;line-height:1.45;margin:6px 0 10px}
.snd{color:var(--cond);font-size:13px}
.snd svg{display:block;width:100%;height:auto}
.snd-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.snd-legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
/* Members */
#memName{width:100%}
.mem-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line2);background:var(--panel2);border-radius:12px;padding:10px 12px;margin-top:10px}
.mem-av{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none;background:var(--accent2);color:#fff;display:inline-grid;place-items:center;font-weight:800;font-size:18px;border:2px solid var(--line)}
.mem-av.big{width:84px;height:84px}
.mem-av[hidden]{display:none}
.mem-name{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.mem-row .del{height:30px;padding:0 10px;font-size:12px;flex:none}
.mem-row .del.armed{border-color:var(--errc);color:var(--errc)}
/* Card tabs */
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{height:36px;padding:0 16px;border-radius:999px;font-weight:700;font-size:13px}
.tab.on,.tab.on:hover{background:var(--accent2);border-color:var(--accent2);color:#fff}
/* Join modal */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal[hidden]{display:none}
.modal-card{position:relative;width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px 22px 22px;box-shadow:0 24px 70px var(--shadow)}
.modal-title{font-size:18px;font-weight:800;line-height:1.3;padding-right:30px}
.modal-desc{color:var(--cond);margin:10px 0 18px;font-size:14px;line-height:1.55}
.modal-x{position:absolute;top:10px;right:10px;width:34px;height:34px;padding:0;border-radius:50%;font-size:14px}
.modal .btn-link{width:100%}
/* Settings */
.settings-wrap{position:relative}
.icon-btn{width:44px;padding:0;display:grid;place-items:center}
.panel-pop{position:absolute;right:0;top:calc(100% + 10px);width:min(330px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 18px 50px var(--shadow);z-index:60}
.panel-pop[hidden]{display:none}
.set-title{font-weight:750;font-size:15px}
.set-row{margin-top:14px}
.set-label{font-size:10px;letter-spacing:1.4px;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button,.langs button{height:36px;border:0;border-radius:8px;background:transparent;padding:0 10px;font-weight:600;color:var(--text)}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.langs button{border:1px solid var(--line);background:var(--panel2);height:auto;min-height:40px;padding:6px 8px;font-size:13px;line-height:1.2}
.seg button:hover,.langs button:hover{background:var(--hover);color:var(--accent)}
.seg button.on,.langs button.on,.seg button.on:hover,.langs button.on:hover{background:var(--accent2);border-color:var(--accent2);color:#fff}

@media(max-width:900px){.grid{grid-template-columns:1fr}}
@media(max-width:760px){
 header{grid-template-columns:1fr auto;padding:10px 12px;gap:8px}
 .brandwrap{order:1}.topright{order:2}
 .center{order:3;grid-column:1/-1;width:100%}
 .search{flex:1}.search input{width:auto;flex:1}
 .brand-logo{width:46px;height:46px}.sub,.live{display:none}
 .temp{font-size:60px}
}
@media(prefers-reduced-motion:reduce){.reveal{transition:none;opacity:1;transform:none;filter:none}html{scroll-behavior:auto}}
</style>

<!-- Vertical-only blur used for scroll motion blur -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="mblur" x="-5%" y="-20%" width="110%" height="140%"><feGaussianBlur id="mblurNode" in="SourceGraphic" stdDeviation="0 0"/></filter></defs></svg>

<header>

const LOCALES={en:'en',fil:'fil',my:'my-u-nu-latn',th:'th-TH-u-ca-gregory',id:'id',ms:'ms'};

/* ---------- Settings (saved in this browser) ---------- */
const SKEY='meteostorm_settings';
const settings={unit:'c',theme:'dark',lang:'en'};
try{Object.assign(settings,JSON.parse(localStorage.getItem(SKEY)||'{}'))}catch(e){}
if(!I18N[settings.lang])settings.lang='en';
if(!['c','f'].includes(settings.unit))settings.unit='c';
if(!['dark','light'].includes(settings.theme))settings.theme='dark';
function saveSettings(){try{localStorage.setItem(SKEY,JSON.stringify(settings))}catch(e){}}
const t=k=>(I18N[settings.lang]&&I18N[settings.lang][k])||I18N.en[k]||k;

function weatherText(code){
 let k='w_var';
 if(code===0)k='w_clear';else if([1,2].includes(code))k='w_mostly';else if(code===3)k='w_cloudy';else if([45,48].includes(code))k='w_fog';
 else if([51,53,55,56,57].includes(code))k='w_drizzle';else if([61,63,65,66,67,80,81,82].includes(code))k='w_rain';
 else if([71,73,75,77,85,86].includes(code))k='w_snow';else if([95,96,99].includes(code))k='w_thunder';
 return t(k)
}
function fmt(v,d=0){return v==null?'--':Number(v).toFixed(d)}
function tmp(v){return v==null?'--':(settings.unit==='f'?Number(v)*9/5+32:Number(v)).toFixed(0)}

/* Status line is stored as a key so it can be re-translated */
let statusState={key:'connecting',params:{},err:false,extra:''};
function setStatus(key,params={},err=false,extra=''){statusState={key,params,err,extra};renderStatus()}
function renderStatus(){
 const s=statusState;let txt=t(s.key);
 for(const k in s.params)txt=txt.replace('{'+k+'}',s.params[k]);
 $('status').textContent=txt+(s.extra||'');$('status').className='status'+(s.err?' error':'');
}
const ierr=k=>{const e=new Error(k);e.i18n=k;return e};
function showError(e){if(e.i18n)setStatus(e.i18n,{},true);else setStatus('couldNot',{},true,': '+e.message)}

function render(){
 if(!lastData)return;
 const d=lastData,c=d.current,h=d.hourly,loc=LOCALES[settings.lang]||'en',U=settings.unit.toUpperCase();
 $('temp').textContent=tmp(c.temperature_2m)+'°'+U;$('condition').textContent=weatherText(c.weather_code);
 $('wind').innerHTML=fmt(c.wind_speed_10m)+' <small>km/h</small>';$('winddir').textContent=direction(c.wind_direction_10m)+' · '+fmt(c.wind_direction_10m)+'°';
 $('arrow').style.transform=`rotate(${c.wind_direction_10m}deg)`;$('arrow').textContent='↑';
 $('feels').textContent=tmp(c.apparent_temperature)+'°';$('humidity').textContent=fmt(c.relative_humidity_2m)+'%';
 $('clouds').textContent=fmt(c.cloud_cover)+'%';$('rain').textContent=fmt(c.precipitation,1)+' mm';
 $('pressure').textContent=fmt(c.pressure_msl)+' hPa';$('gust').textContent=fmt(c.wind_gusts_10m)+' km/h';
 $('updated').textContent=t('modelTime')+' · '+new Date(c.time).toLocaleString(loc);
 const idx=h.time.findIndex(x=>x>=c.time);const i=Math.max(0,idx);
 $('dew').textContent=tmp(h.dew_point_2m?.[i])+'°';$('cape').textContent=fmt(h.cape?.[i])+' J/kg';
 $('hours').innerHTML='';
 for(let j=i;j<Math.min(i+24,h.time.length);j++){
  const el=document.createElement('div');el.className='hour';
  el.innerHTML=`<small>${new Date(h.time[j]).toLocaleTimeString(loc,{hour:'numeric'})}</small><b>${tmp(h.temperature_2m[j])}°</b><em>${fmt(h.precipitation_probability[j])}% ${t('rainPct')}</em><div class="w">${fmt(h.wind_speed_10m[j])} km/h</div>`;
  $('hours').appendChild(el);
 }
 renderDaily();
}

async function loadWeather(){
 setStatus('refreshing');
 const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,rain,showers,weather_code,cloud_cover,pressure_msl,surface_pressure,wind_speed_10m,wind_direction_10m,wind_gusts_10m&hourly=temperature_2m,precipitation_probability,wind_speed_10m,weather_code,dew_point_2m,cloud_cover,cape&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=7&timezone=auto&wind_speed_unit=kmh`;
 try{
  const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);
  lastData=await r.json();render();if(!$('radarView').hidden)loadRadar();
  setStatus('updatedFrom',{},false,' · '+(lastData.timezone||'local timezone'));
 }catch(e){showError(e)}
}
function setPlace(){$('place').textContent=placeKey?t(placeKey):placeName;renderSaved()}
async function searchPlace(){
 const q=$('search').value.trim();if(!q)return;
 setStatus('searching',{q});
 try{
  const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=10&language=en&format=json');
  const d=await r.json();if(!d.results?.length)throw ierr('notFound');
  const p=d.results[0];
  if(!inSEA(p.latitude,p.longitude))throw ierr('outsideSEA');
  lat=p.latitude;lon=p.longitude;placeKey=null;placeName=[p.name,p.admin1,p.country].filter(Boolean).join(', ');
  setPlace();loadWeather();
 }catch(e){showError(e)}
}
$('searchBtn').onclick=searchPlace;$('search').addEventListener('keydown',e=>{if(e.key==='Enter')searchPlace()});

function applyLang(){
 document.documentElement.lang=settings.lang;
 document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});
 document.querySelectorAll('[data-i18n-ph]').forEach(el=>{el.placeholder=t(el.dataset.i18nPh)});
 $('settingsBtn').setAttribute('aria-label',t('settings'));$('settingsBtn').title=t('settings');$('joinClose').setAttribute('aria-label',t('joinClose'));renderReports();renderRepMsg();renderMembers();renderMemMsg();$('sndBtn').title=t('sndTitle');$('sndBtn').setAttribute('aria-label',t('sndTitle'));$('sndClose').setAttribute('aria-label',t('joinClose'));if(!$('sndModal').hidden)renderSounding();$('a2hsBtn').setAttribute('aria-label',t('a2hsTitle'));$('a2hsBtn').title=t('a2hsTitle');$('a2hsClose').setAttribute('aria-label',t('joinClose'));
 setPlace();render();renderStatus();
}
function applyTheme(){
 document.documentElement.dataset.theme=settings.theme;
 const tc=document.querySelector('meta[name="theme-color"]');if(tc)tc.content=settings.theme==='light'?'#f3f6fb':'#07090d';
 const m=document.querySelector('meta[name="color-scheme"]');if(m)m.content=settings.theme;
}
function syncSettingsUI(){
 const mark=(sel,attr,val)=>document.querySelectorAll(sel).forEach(b=>{const on=b.dataset[attr]===val;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
 mark('[data-unit]','unit',settings.unit);mark('[data-theme-val]','themeVal',settings.theme);mark('[data-lang]','lang',settings.lang);
}
function applyAll(){applyTheme();syncSettingsUI();applyLang()}
document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{settings.unit=b.dataset.unit;saveSettings();syncSettingsUI();render();renderFav()});
document.querySelectorAll('[data-theme-val]').forEach(b=>b.onclick=()=>{settings.theme=b.dataset.themeVal;saveSettings();applyTheme();syncSettingsUI()});
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{settings.lang=b.dataset.lang;saveSettings();syncSettingsUI();applyLang()});
(function(){
 const btn=$('settingsBtn'),panel=$('settingsPanel');
 const setOpen=o=>{panel.hidden=!o;btn.setAttribute('aria-expanded',o)};
 btn.onclick=e=>{e.stopPropagation();setOpen(panel.hidden)};
 document.addEventListener('click',e=>{if(!panel.hidden&&!panel.contains(e.target)&&!btn.contains(e.target))setOpen(false)});

function sha256(msg){
 const b=Array.from(new TextEncoder().encode(msg));
 const len=b.length*8;
 b.push(0x80);while(b.length%64!==56)b.push(0);
 const hi=Math.floor(len/4294967296),lo=len>>>0;
 b.push(hi>>>24&255,hi>>>16&255,hi>>>8&255,hi&255,lo>>>24&255,lo>>>16&255,lo>>>8&255,lo&255);
 const K=[],H=[],isc={};let pc=0;
 for(let c=2;pc<64;c++){if(!isc[c]){for(let i=c*c;i<400;i+=c)isc[i]=1;if(pc<8)H[pc]=(Math.pow(c,.5)*4294967296)|0;K[pc++]=(Math.pow(c,1/3)*4294967296)|0}}
 const rr=(v,a)=>(v>>>a)|(v<<(32-a));
 for(let o=0;o<b.length;o+=64){
  const w=new Array(64);
  for(let i=0;i<16;i++)w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
  for(let i=16;i<64;i++){const s0=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3),s1=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
  let [a,bb,c,d,e,f,g,h]=H;
  for(let i=0;i<64;i++){const S1=rr(e,6)^rr(e,11)^rr(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+w[i])|0,S0=rr(a,2)^rr(a,13)^rr(a,22),mj=(a&bb)^(a&c)^(bb&c),t2=(S0+mj)|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0}
  H[0]=(H[0]+a)|0;H[1]=(H[1]+bb)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
 }
 return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}

/* ---------- Reports (password-protected posting) ---------- */
const PASS_HASH='d932723831ebbf1752fff4f17d4a0acb4eb006639907731994c0494a52c6f037';
const RKEY='meteostorm_reports';
let reports=[],adminOn=false,repMsgState=null,pendingImage=null;
try{reports=JSON.parse(localStorage.getItem(RKEY)||'[]')}catch(e){}
if(!Array.isArray(reports))reports=[];
const REPORT_TTL=24*60*60*1000; // reports disappear after 1 day
function pruneReports(){const keep=reports.filter(r=>Date.now()-r.ts<REPORT_TTL);if(keep.length!==reports.length){reports=keep;saveReports()}}
pruneReports();
function saveReports(){try{localStorage.setItem(RKEY,JSON.stringify(reports));return true}catch(e){return false}}
function setRepMsg(key,err){repMsgState=key?{key,err:!!err}:null;renderRepMsg()}
function renderRepMsg(){const el=$('repMsg');el.textContent=repMsgState?t(repMsgState.key):'';el.className='status'+(repMsgState&&repMsgState.err?' error':'')}
function syncAdminUI(){$('repAdminBtn').hidden=adminOn;$('repForm').hidden=!adminOn;if(adminOn)$('repLogin').hidden=true}
function renderReports(){
 pruneReports();
 const list=$('repList');list.innerHTML='';
 if(!reports.length){const d=document.createElement('div');d.className='status';d.textContent=t('noReports');list.appendChild(d);return}
 const loc=LOCALES[settings.lang]||'en';
 reports.forEach(r=>{
  const card=document.createElement('div');card.className='report';
  if(r.img){const im=document.createElement('img');im.src=r.img;im.alt='';card.appendChild(im)}
  const body=document.createElement('div');body.className='body';
  if(r.text){const p=document.createElement('p');p.textContent=r.text;body.appendChild(p)}
  const meta=document.createElement('div');meta.className='meta';
  const when=document.createElement('span');when.textContent=new Date(r.ts).toLocaleString(loc);meta.appendChild(when);
  if(adminOn){
   const del=document.createElement('button');del.className='del';del.textContent=t('repDelete');
   let armed=false,timer=null;
   del.onclick=()=>{
    if(!armed){armed=true;del.classList.add('armed');del.textContent=t('repConfirm');timer=setTimeout(()=>{armed=false;del.classList.remove('armed');del.textContent=t('repDelete')},3500);return}
    clearTimeout(timer);reports=reports.filter(x=>x.id!==r.id);saveReports();renderReports();
   };
   meta.appendChild(del);
  }
  body.appendChild(meta);card.appendChild(body);list.appendChild(card);
 });
}
function readImage(file){return new Promise((res,rej)=>{
 const fr=new FileReader();fr.onerror=rej;
 fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
  const sc=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.75))};im.src=fr.result};
 fr.readAsDataURL(file);
})}

 if(sha256('meteostorm|'+$('repPass').value)===PASS_HASH){adminOn=true;$('repPass').value='';setRepMsg(null);syncAdminUI();renderReports();syncMemUI();renderMembers()}
 else setRepMsg('repWrong',true);
}

 pendingImage=null;$('repPreview').hidden=true;$('repFile').value='';$('repDesc').value='';setRepMsg(null);renderReports();
};

/* ---------- 7-day outlook ---------- */
function wIcon(c){
 if(c===0)return'☀️';if(c===1||c===2)return'🌤️';if(c===3)return'☁️';if(c===45||c===48)return'🌫️';
 if([51,53,55,56,57].includes(c))return'🌦️';if([61,63,65,66,67,80,81,82].includes(c))return'🌧️';
 if([71,73,75,77,85,86].includes(c))return'❄️';if([95,96,99].includes(c))return'⛈️';return'🌡️'
}
function renderDaily(){
 const box=$('daily');if(!lastData||!lastData.daily)return;
 const dd=lastData.daily,loc=LOCALES[settings.lang]||'en',mins=dd.temperature_2m_min,maxs=dd.temperature_2m_max;
 const lo=Math.min(...mins),hi=Math.max(...maxs),span=Math.max(1,hi-lo);
 box.innerHTML='';
 for(let i=0;i<dd.time.length;i++){
  const [y,m,da]=dd.time[i].split('-').map(Number);
  const day=i===0?t('today'):new Date(y,m-1,da).toLocaleDateString(loc,{weekday:'short'});
  const left=((mins[i]-lo)/span*100).toFixed(1),width=Math.max(6,(maxs[i]-mins[i])/span*100).toFixed(1);
  const row=document.createElement('div');row.className='day';row.title=weatherText(dd.weather_code[i]);
  row.innerHTML=`<span class="dname">${day}</span><span class="dicon" aria-hidden="true">${wIcon(dd.weather_code[i])}</span><span class="dpop">${fmt(dd.precipitation_probability_max[i])}%</span><span class="dlo">${tmp(mins[i])}°</span><span class="dbar"><i style="left:${left}%;width:${width}%"></i></span><span class="dhi">${tmp(maxs[i])}°</span>`;
  box.appendChild(row);
 }
}

/* ---------- Soundings (model-based Skew-T from Open-Meteo pressure levels) ---------- */
const SND_LEVELS=[1000,975,950,925,900,850,800,700,600,500,400,300,250,200,150,100];
let sndProf=null,sndToken=0;
function dewFrom(T,rh){
 if(T==null||rh==null)return null;
 const g=Math.log(Math.max(rh,1)/100)+(17.62*T)/(243.12+T);
 return 243.12*g/(17.62-g);
}
function buildProfile(j){
 const h=j.hourly,off=j.utc_offset_seconds||0;
 const nowKey=new Date(Date.now()+off*1000).toISOString().slice(0,13);
 let i=h.time.findIndex(x=>x.slice(0,13)===nowKey);if(i<0)i=0;
 const g=(k)=>{const a=h[k];return a?a[i]:null};
 const psfc=g('surface_pressure'),pts=[];
 if(g('temperature_2m')!=null)pts.push({p:psfc||1013,T:g('temperature_2m'),Td:g('dew_point_2m'),ws:g('wind_speed_10m'),wd:g('wind_direction_10m'),z:j.elevation||0,sfc:true});
 SND_LEVELS.forEach(L=>{
  if(psfc!=null&&L>=psfc-2)return;
  const T=g('temperature_'+L+'hPa');if(T==null)return;
  pts.push({p:L,T,Td:dewFrom(T,g('relative_humidity_'+L+'hPa')),ws:g('wind_speed_'+L+'hPa'),wd:g('wind_direction_'+L+'hPa'),z:g('geopotential_height_'+L+'hPa')});
 });
 pts.sort((a,b)=>b.p-a.p);
 return{pts,time:h.time[i]};
}
function freezingLevel(pts){
 for(let k=0;k<pts.length-1;k++){
  const a=pts[k],b=pts[k+1];
  if(a.z==null||b.z==null)continue;
  if(a.T>=0&&b.T<0)return a.z+(b.z-a.z)*(0-a.T)/(b.T-a.T);
 }
 return null;
}
function barbSvg(x,y,kt,dir){
 if(kt==null||dir==null)return'';
 let s=Math.round(kt/5)*5;
 if(s<5)return`<circle cx="${x}" cy="${y}" r="3" fill="none" stroke="currentColor" stroke-width="1.2"/>`;
 const a=dir*Math.PI/180,ux=Math.sin(a),uy=-Math.cos(a),px=-uy,py=ux,L=24,f=n=>n.toFixed(1);
 const tx=x+ux*L,ty=y+uy*L,pos=k=>[tx-ux*3.2*k,ty-uy*3.2*k];
 let d=`M${f(x)} ${f(y)}L${f(tx)} ${f(ty)}`,fill='',k=0;
 while(s>=50){const[a1,b1]=pos(k),[a2,b2]=pos(k+1.6);fill+=`<polygon points="${f(a1)},${f(b1)} ${f(a1+px*9)},${f(b1+py*9)} ${f(a2)},${f(b2)}"/>`;k+=2;s-=50}
 while(s>=10){const[a1,b1]=pos(k);d+=`M${f(a1)} ${f(b1)}L${f(a1+px*9+ux*3)} ${f(b1+py*9+uy*3)}`;k+=1;s-=10}
 if(s>=5){if(k===0)k=1;const[a1,b1]=pos(k);d+=`M${f(a1)} ${f(b1)}L${f(a1+px*4.5+ux*1.5)} ${f(b1+py*4.5+uy*1.5)}`}
 return`<path d="${d}" fill="none" stroke="currentColor" stroke-width="1.2"/>${fill?`<g fill="currentColor">${fill}</g>`:''}`;
}
function skewTSvg(pts){
 const W=360,H=480,L=36,T0=12,w=266,h=442,LB=Math.log(1050),LT=Math.log(100);
 const u=p=>(LB-Math.log(p))/(LB-LT),Y=p=>T0+h*(1-u(p)),X=(T,p)=>L+w*((T+40)/90+0.8*u(p));
 const f=n=>n.toFixed(1);let g='';
 // isotherms
 for(let T=-120;T<=50;T+=10){
  const zero=T===0;
  g+=`<line x1="${f(X(T,1050))}" y1="${f(Y(1050))}" x2="${f(X(T,100))}" y2="${f(Y(100))}" stroke="${zero?'#38bdf8':'var(--line)'}" stroke-width="${zero?1.4:0.8}" ${zero?'stroke-dasharray="5 4"':''} opacity="${zero?0.9:0.7}"/>`;
 }
 // dry adiabats
 for(let th=250;th<=480;th+=20){
  let d='';for(let p=1050;p>=100;p-=50){d+=(d?'L':'M')+f(X(th*Math.pow(p/1000,0.2857)-273.15,p))+' '+f(Y(p))}
  g+=`<path d="${d}" fill="none" stroke="#f59e0b" stroke-width="0.8" opacity="0.28"/>`;
 }
 // isobars
 let lab='';
 [1000,900,800,700,600,500,400,300,200,100].forEach(p=>{
  g+=`<line x1="${L}" y1="${f(Y(p))}" x2="${L+w}" y2="${f(Y(p))}" stroke="var(--muted)" stroke-width="0.8" opacity="0.5"/>`;
  lab+=`<text x="${L-4}" y="${f(Y(p)+3)}" text-anchor="end">${p}</text>`;
 });
 // bottom temperature labels
 for(let T=-30;T<=40;T+=10){const x=X(T,1050);if(x>=L&&x<=L+w)lab+=`<text x="${f(x)}" y="${H-8}" text-anchor="middle">${T}</text>`}
 // profile
 const tp=pts.map(q=>f(X(q.T,q.p))+','+f(Y(q.p))).join(' ');
 const dp=pts.filter(q=>q.Td!=null&&q.p>=300).map(q=>f(X(q.Td,q.p))+','+f(Y(q.p))).join(' ');
 // wind barbs
 let barbs='',lastY=-99;const xb=L+w+30;
 pts.forEach(q=>{
  if(!(q.sfc||[925,850,700,600,500,400,300,250,200,150,100].includes(q.p)))return;
  const y=Y(q.p);if(Math.abs(y-lastY)<14)return;lastY=y;barbs+=barbSvg(xb,y,q.ws,q.wd);
 });
 return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Skew-T"><defs><clipPath id="sndClip"><rect x="${L}" y="${T0}" width="${w}" height="${h}"/></clipPath></defs>
<rect x="${L}" y="${T0}" width="${w}" height="${h}" fill="var(--panel2)" stroke="var(--line)"/>
<g clip-path="url(#sndClip)">${g}<polyline points="${dp}" fill="none" stroke="#22c55e" stroke-width="2.4" stroke-linejoin="round"/><polyline points="${tp}" fill="none" stroke="#ef4444" stroke-width="2.4" stroke-linejoin="round"/></g>
<g fill="var(--muted)" font-size="10">${lab}<text x="${xb}" y="${H-8}" text-anchor="middle">kt</text></g>
<g style="color:var(--text)">${barbs}</g></svg>`;
}
function renderSounding(){
 const title=$('sndTitleEl'),sub=$('sndSub'),body=$('sndBody');
 title.textContent=t('sndTitle')+' · '+(placeKey?t(placeKey):placeName);
 if(sndProf==='loading'){sub.textContent='';body.textContent=t('sndLoading');return}
 if(!sndProf||!sndProf.pts.length){sub.textContent='';body.textContent=t('sndError');return}
 const when=new Date(sndProf.time).toLocaleString(LOCALES[settings.lang]||'en',{dateStyle:'medium',timeStyle:'short'});
 sub.textContent=t('sndModel').replace('{t}',when);
 const fz=freezingLevel(sndProf.pts);

/* ---------- Members (password-protected, same password as Reports) ---------- */

function readSquare(file,size){return new Promise((res,rej)=>{
 const fr=new FileReader();fr.onerror=rej;
 fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
  const c=document.createElement('canvas');c.width=c.height=size;
  const side=Math.min(im.width,im.height),sx=(im.width-side)/2,sy=(im.height-side)/2;
  c.getContext('2d').drawImage(im,sx,sy,side,side,0,0,size,size);res(c.toDataURL('image/jpeg',.8))};im.src=fr.result};
 fr.readAsDataURL(file);
})}

/* ---------- Scroll motion blur ---------- */
(function(){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const content=$('content'),node=$('mblurNode');
 const safari=/^((?!chrome|android|crios|fxios).)*safari/i.test(navigator.userAgent);
 let last=scrollY,v=0,active=false;
 function tick(){
  const y=scrollY,delta=Math.abs(y-last);last=y;
  v+=(delta-v)*.28;                       // smooth the velocity
  const blur=Math.min(7,v*.16);           // px of blur for the current speed
  if(blur>.25){
   if(safari){content.style.filter=`blur(${(blur*.35).toFixed(2)}px)`}
   else{node.setAttribute('stdDeviation','0 '+blur.toFixed(2));content.style.filter='url(#mblur)'}
   active=true;
  }else if(active){content.style.filter='';active=false}
  requestAnimationFrame(tick);
 }
 requestAnimationFrame(tick);
})();

/* ---------- Blur-in reveal on scroll ---------- */
(function(){
 const els=document.querySelectorAll('.reveal');
 if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return}
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08});
 els.forEach((e,i)=>{e.style.transitionDelay=(i*70)+'ms';io.observe(e)});
})();
